name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate site
        run: |
          npx --yes html-validate@9 site/index.html site/table.html
          node --check site/app.js
          node --check site/table.js

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Stage files for Pages
        run: |
          mkdir -p _site/pdf
          cp -r site/. _site/
          cp 4D_Combinatoric_Worldbuilding_Review_SinglePages.pdf _site/pdf/4d8-Worlds-Zine-SinglePages.pdf
          cp 4D_Combinatoric_Worldbuilding_PrinterSpreads_USLetter.pdf _site/pdf/4d8-Worlds-Zine-USLetter-Booklet.pdf
          cp 4D_Combinatoric_Worldbuilding_PrinterSpreads_A4.pdf _site/pdf/4d8-Worlds-Zine-A4-Booklet.pdf
          rm -f _site/*.md
          touch _site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '_site'

  deploy:
    name: Deploy
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
